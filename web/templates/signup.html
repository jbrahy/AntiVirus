<!-- web/templates/signup.html -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign up — NexGuard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="topbar">
    <a class="brand" href="/"><svg class="brand-mark" width="20" height="22" viewBox="0 0 20 22" aria-hidden="true"><path d="M10 1l8 3v6c0 5.5-3.5 9-8 11-4.5-2-8-5.5-8-11V4l8-3z" stroke="#2957a4" stroke-width="1.6" fill="#eef3fb"/><path d="M6.5 11l2.5 2.5 5-5" stroke="#c8912b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>NexGuard<span class="dot">.</span></a>
    <nav>
      <a href="/login">Log in instead</a>
    </nav>
  </div>

  <main class="container">
    <section class="hero">
      <p class="label">§ Account</p>
      <h1>Create your account</h1>
      <p class="lede dim">Free to sign up. Subscribe from your dashboard
      whenever you're ready.</p>

      {{if .Error}}<p class="error-banner">{{.Error}}</p>{{end}}

      <form method="post" action="/signup">
        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" name="email" required autofocus>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" type="password" name="password" required minlength="8">
        </div>
        <div class="field">
          <label for="phone">Mobile phone <span class="dim">(optional)</span></label>
          <input id="phone" type="tel" name="phone" autocomplete="tel"
                 inputmode="tel" placeholder="(555) 555-5555">
          <p class="hint">Only needed if you want scan alerts or account
          notifications by text. Leave it blank and nothing changes.</p>
        </div>

        <!--
          Carrier compliance, per docs/carrier-compliance.md:
          neither box carries `required`, they are unchecked by default, they
          are separate (service vs marketing must never share one opt-in), and
          each states its full disclosure on its own rather than inheriting one.
        -->
        <div class="consent">
          <label class="consent-row">
            <input type="checkbox" name="sms_service_consent" value="1">
            <span>I give my express consent to receive recurring automated service
            updates and account notifications texts to the phone number from
            <strong>{{.Site.Brand}}</strong>. Message and data rates may apply.
            Msg frequency varies. I understand I can opt-out by replying 'STOP'
            to any message, or get more info by replying 'HELP.' Consent is not
            required for purchasing products or services. My number will not be
            shared with third parties or affiliates. View our
            <a href="/terms">Terms of Services</a> and
            <a href="/privacy">Privacy Policy</a>.</span>
          </label>

          <label class="consent-row">
            <input type="checkbox" name="sms_marketing_consent" value="1">
            <span>I give my express consent to receive recurring automated
            marketing notification texts to the phone number from
            <strong>{{.Site.Brand}}</strong>. Message and data rates may apply.
            Msg frequency varies. I understand I can opt-out by replying 'STOP'
            to any message, or get more info by replying 'HELP.' Consent is not
            required for purchasing products or services. My number will not be
            shared with third parties or affiliates. View our
            <a href="/terms">Terms of Services</a> and
            <a href="/privacy">Privacy Policy</a>.</span>
          </label>
        </div>

        <button class="btn btn-primary btn-block" type="submit">Create account</button>
      </form>
    </section>
  </main>
</body>
</html>
