<!-- web/templates/login.html -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in — NexGuard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="topbar">
    <a class="brand" href="/">NexGuard<span class="dot">.</span></a>
    <nav>
      <a href="/signup">Sign up instead</a>
    </nav>
  </div>

  <main class="container">
    <section class="hero">
      <p class="label">§ Account</p>
      <h1>Log in</h1>

      {{if .Error}}<p class="error-banner">{{.Error}}</p>{{end}}

      <form method="post" action="/login">
        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" name="email" required autofocus>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" type="password" name="password" required>
        </div>
        <button class="btn btn-primary btn-block" type="submit">Log in</button>
      </form>
    </section>
  </main>
</body>
</html>
